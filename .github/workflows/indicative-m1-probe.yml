name: Indicatieve M1 bronproef
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/indicative-m1-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/indicative-m1.test.mjs
      - run: node scripts/probe_indicative_m1.mjs
