name: Trading Company koersmonitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'package.json'
      - 'docs/index.html'
      - '.github/workflows/market-monitor.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trading-company-feed
  cancel-in-progress: false
jobs:
  refresh_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Verify analysis safety rules
        run: npm test
      - name: Check dashboard JavaScript syntax
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('docs/index.html','utf8'); const js=h.split('<script>')[1].split('</script>')[0]; new Function(js); console.log('Dashboard JavaScript parsed successfully')"
      - name: Actuele indicatieve goudkoersen ophalen
        id: feed
        continue-on-error: true
        run: npm run update:indicative
      - name: Bewaar geldige koersdata en demo-observaties
        if: steps.feed.outcome == 'success'
        run: |
          git config user.name "trading-company-bot"
          git config user.email "trading-company-bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/observations.json
          git diff --cached --quiet || (git commit -m "Update gold snapshots" && git push)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Controleer of de koersvernieuwing werkelijk slaagde
        if: always()
        run: |
          if [ "${{ steps.feed.outcome }}" != "success" ]; then
            echo "::error::De website kan gepubliceerd zijn, maar de koersfeed is niet bijgewerkt."
            exit 1
          fi
