name: Trading Company koersmonitor
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'package.json'
      - 'docs/index.html'
      - 'docs/b2.js'
      - 'docs/live-m1.js'
      - 'docs/TradingCompany_B2_v1.pine'
      - '.github/workflows/market-monitor.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trading-company-feed
  cancel-in-progress: false
jobs:
  refresh_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Verify analysis safety rules
        run: npm test
      - name: Check dashboard JavaScript syntax
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('docs/index.html','utf8'); const js=h.split('<script>')[1].split('</script>')[0]; new Function(js); new Function(fs.readFileSync('docs/b2.js','utf8')); new Function(fs.readFileSync('docs/live-m1.js','utf8')); console.log('Dashboard JavaScript parsed successfully')"
      - name: Actuele indicatieve goudkoersen ophalen
        id: feed
        continue-on-error: true
        run: npm run update:indicative
      - name: Maak de Amerikaanse premarket-radar
        id: radar
        continue-on-error: true
        run: node scripts/update_stock_radar.mjs
      - name: Bewaar koersdata en aandelenradar
        if: steps.feed.outcome == 'success' || steps.radar.outcome == 'success'
        run: |
          git config user.name "trading-company-bot"
          git config user.email "trading-company-bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/observations.json docs/data/stock-radar.json
          if ! git diff --cached --quiet; then
            git commit -m "Update gold snapshots"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Koersdata en onderzoek veilig opgeslagen."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Opslaan van de koersdata is na 3 pogingen mislukt."
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Controleer of de koersvernieuwing werkelijk slaagde
        if: always()
        run: |
          if [ "${{ steps.feed.outcome }}" != "success" ]; then
            echo "::error::De website kan gepubliceerd zijn, maar de koersfeed is niet bijgewerkt."
            exit 1
          fi
